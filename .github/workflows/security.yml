name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # weekly: new CVEs appear without any code change

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the full history, not only the last commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-scan:
    name: SAST and dependency audit (Bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: Bandit (static analysis of app code)
        run: bandit -r app
      - name: pip-audit (known CVEs in dependencies)
        run: pip-audit -r app/requirements.txt

  iac-scan:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov
      # soft-fail: report findings without failing the build. Review the list,
      # fix or skip each finding on purpose, then remove --soft-fail.
      - name: Checkov (Terraform, Kubernetes, Dockerfile)
        run: >
          checkov -d terraform -d k8s -d app
          --skip-path terraform/.terraform
          --compact --soft-fail

  image-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gke-demo-app:scan ./app
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gke-demo-app:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true   # only fail on issues that have a fix available
          exit-code: "1"