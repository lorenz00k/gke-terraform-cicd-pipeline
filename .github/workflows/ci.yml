name: CI Pipeline

on: 
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# Cancel outdated runs of the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, type check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
 
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14" 
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            app/requirements.txt
 
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
 
      - name: Ruff lint
        run: ruff check .
 
      - name: Ruff format check
        run: ruff format --check .
 
      - name: mypy
        run: mypy
 
      - name: pytest
        run: pytest
 
  build-and-smoke-test:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7
 
      - name: Build image
        run: docker build -t gke-demo-app:ci ./app
 
      - name: Smoke test
        run: bash tests/smoke_test.sh gke-demo-app:ci

  kind-test:
    name: Deploy to kind and test
    runs-on: ubuntu-latest
    needs: build-and-smoke-test
    steps:
      - uses: actions/checkout@v7
      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: ci

      - name: Build image
        run: docker build -t gke-demo-app:ci ./app
      
      - name: load image into kind
        run: kind load docker-image gke-demo-app:ci --name ci
      
      - name: Apply ci Manifest
        run: kubectl apply -k k8s-ci/
      
      - name: Post deploy check
        run: bash tests/post_deploy_test.sh DEPLOYMENT=app-deployment SERVICE=app-service NAMEPSPACE=gke-terra LOCAL=1 ROLLBACK=0
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods
          kubectl describe deployment app-deployment
          kubectl logs deployment/app-deployment --tail=100