apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment # name of the app
  namespace: gke-terra
  checkov.io/skip1: CKV_K8S_43=Digest pinning not needed for a demo
  checkov.io/skip2: CKV2_K8S_6=No NetworkPolicy until cluster network policy is enabled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myApp  # which pods are part of the deployment
  template:
    metadata:
      labels:
        app: myApp  #name of the pod(s)
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault # CKV_K8S_31
      automountServiceAccountToken: false

      containers:
      - name: app
        image: europe-west3-docker.pkg.dev/terraform-cicd-pipeline-509514/gke-demo-repo/gke-demo-app:latest
        imagePullPolicy: Always

        ports:  #defines container ports
        - name: http
          containerPort: 8080   # is target port of service

        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL # removes all kernel rights. 
        resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
        readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
        livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
